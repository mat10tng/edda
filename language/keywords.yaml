# Edda keyword registry, generated from language/reference.md (revision 58).
# Plain YAML, not a spec file: the .edda subset does not apply here.
# Every key, expression form, fixed name, checker rule and read-view
# sentence kind, with what it means, why it exists and where it comes
# from. The checker refuses any key not in schema.json and any form not
# here. Hover text in the views comes from means and why. A new row is
# added like a rule, with a because.

keys:
  - key: 'roles:'
    section: 'Roles'
    means: 'the kinds of actor, person or program'
    why: 'permissions and stories name roles'
  - key: 'is:'
    section: 'Roles'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'properties:'
    section: 'Roles'
    means: 'the properties a holder of this role has, name to type phrase'
    why: 'ACTOR.shop == order.shop needs a shop'
  - key: 'entities:'
    section: 'Entities'
    means: 'the kinds of business object the system keeps'
    why: 'the glossary; every expression is over declared names'
  - key: 'is:'
    section: 'Entities'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'properties:'
    section: 'Entities'
    means: 'name to type phrase, or {computed: expr}'
    why: 'the shape the checker and the binding read'
  - key: 'part_of:'
    section: 'Entities'
    means: 'this entity belongs to that one'
    why: 'placement and the frame rule follow the owner'
  - key: 'may_change:'
    section: 'Entities'
    means: 'per choice property, optional or not, the only allowed changes from one choice value to others (type_mismatch on a property that is no choice)'
    why: 'a change outside it fails at run time; an unreached value of a choice with DEFAULT is flagged'
  - key: 'always:'
    section: 'Entities'
    means: 'facts that hold after every operation'
    why: 'invariants checked on the suite'
  - key: 'may_create:'
    section: 'Entities'
    means: 'who may create one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_read:'
    section: 'Entities'
    means: 'who may read one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_update:'
    section: 'Entities'
    means: 'who may change one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_delete:'
    section: 'Entities'
    means: 'who may delete one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'epics:'
    section: 'Stories'
    means: 'id to one sentence of intent; no rules'
    why: 'one level above the story, nothing deeper; done when its stories are'
  - key: 'stories:'
    section: 'Stories'
    means: 'id to story'
    why: 'the unit of done, review, version and delivery'
  - key: 'story:'
    section: 'Stories'
    means: 'the sentence'
    why: 'what the customer said'
  - key: 'about:'
    section: 'Stories'
    means: 'the entity it is about'
    why: 'placement, authoritative'
  - key: 'as_a:'
    section: 'Stories'
    means: 'the one role it serves, declared'
    why: 'the read view groups by role'
  - key: 'i_want:'
    section: 'Stories'
    means: 'what the role wants, free text'
    why: 'stored and shown; nothing runs on it'
  - key: 'so_that:'
    section: 'Stories'
    means: 'why the role wants it, free text'
    why: 'stored and shown; nothing runs on it'
  - key: 'epic:'
    section: 'Stories'
    means: 'the id of the epic the story belongs to'
    why: 'grouping; changeable without a new version'
  - key: 'tags:'
    section: 'Stories'
    means: 'a list of labels'
    why: 'grouping; changeable without a new version'
  - key: 'notes:'
    section: 'Stories'
    means: 'what the grammar cannot say, on a story, an operation or an example; ignored by the checker, grey in the view, collected across files'
    why: 'nothing the customer said is lost; repeated notes are the evidence for a new key'
  - key: 'questions:'
    section: 'Stories'
    means: 'the undecided'
    why: 'a flag on an approved story, never a block'
  - key: 'rules:'
    section: 'Stories'
    means: 'optional; a list of rules, each a rule: sentence and the examples that show it; when present, every example of the story is named by exactly one rule (no_rule for one named by none, declared_twice for one named twice, unknown_name for a title that names no example of the story)'
    why: 'Gherkin''s Rule:, with one check: every example belongs to exactly one rule; the layer between the story''s meaning and its examples; decision kb:9378274 entry 100'
  - key: 'rule:'
    section: 'Stories'
    means: 'inside rules:, what the examples under it show, one sentence of free text'
    why: 'the read view heads the examples with it'
  - key: 'shown_by:'
    section: 'Stories'
    means: 'inside rules:, the titles of the examples the rule groups, a list of quoted text'
    why: 'each example tied to the meaning it shows'
  - key: 'operations:'
    section: 'Operations'
    means: 'name to operation; one thing an actor can ask for'
    why: 'the anchor the code carries'
  - key: 'is:'
    section: 'Operations'
    means: 'one sentence of what it does; required'
    why: 'heads the operation in the read view; its meaning beside the mechanics'
  - key: 'inputs:'
    section: 'Operations'
    means: 'name to type phrase, in call order; required inputs are passed by position, , OPTIONAL inputs by keyword (remove(purchase, because="moved")) and are None when left out; an input declared MANY ..., IN ORDER takes only an ordered list'
    why: 'the binding and placement need the types'
  - key: 'who:'
    section: 'Operations'
    means: 'list of who-lines; required'
    why: 'no defaults; wider_than_entity when it admits a role the about entity''s matrix never admits'
  - key: 'refuse:'
    section: 'Operations'
    means: 'list of when condition and reason; the first that holds is given'
    why: 'preconditions with a reason tests match'
  - key: 'ensure:'
    section: 'Operations'
    means: 'list of facts true after; a fact is a quoted expression or {fact, means}; may use OLD(...)'
    why: 'postconditions, each with its meaning when the mechanics do not read'
  - key: 'returns:'
    section: 'Operations'
    means: 'the expression a read operation gives back; never with ensure or also_changes (returns_and_ensure)'
    why: 'one word for reads and writes, command-query separation'
  - key: 'ordered_by:'
    section: 'Operations'
    means: 'list of expressions over one result item, reached by its entity''s name, ascending, ties keep input order; only with a returns that is a list (returns_and_ensure without returns, type_mismatch on a result that is no list)'
    why: 'sorts; without it or an IN ORDER source, a positional check on RESULT is not_ordered'
  - key: 'also_changes:'
    section: 'Operations'
    means: 'quoted property paths ("order.history"), each segment resolved from an input, that the frame rule allows to change without an ensure fact; only with ensure (returns_and_ensure otherwise)'
    why: 'everything else stays unchanged'
  - key: 'notes:'
    section: 'Operations'
    means: 'free text'
    why: 'as on stories'
  - key: 'examples:'
    section: 'Examples'
    means: 'quoted title to example; one concrete run'
    why: 'the acceptance criteria that run'
  - key: 'given:'
    section: 'Examples'
    means: 'a list of things to make; each item has exactly one key besides with: - <entity>: <name> or - actor: <name>'
    why: 'order-independent, schema-checked; names declared here are used below; the binding makes them; no glue is written'
  - key: 'with:'
    section: 'Examples'
    means: 'property name to value: a number, quoted text, a quoted time, True, False, a choice value, a given name, or a flat list of those; roles: (a list of role names) for an actor, fixture: for a spec_file only'
    why: 'a property left out takes its DEFAULT, [] for MANY, None for OPTIONAL, otherwise unset: reading it fails the example; a derived or computed property, or an actor''s name, is derived_in_given; every value is checked against the property''s declared type, and a value whose property may be of several types must fit one of them as a whole, a list included: a plain text or time is unquoted_text, the wrong kind type_mismatch, a choice value not one of its property''s values unknown_choice, a name no given declares unknown_name; roles: written as one name is not_a_list'
  - key: 'fixture:'
    section: 'Examples'
    means: 'the folder under fixtures/; its file, and its history when present, become the given spec_file'
    why: 'the whole spec is the given, never a hand-made fragment'
  - key: 'steps:'
    section: 'Examples'
    means: 'a list of when and then; when may be left out to check the given state'
    why: 'a flow is several steps'
  - key: 'when:'
    section: 'Examples'
    means: 'actor (a declared given), call (a call of a declared operation with its arguments, Python call form; anything else is not_an_expression), at (optional time)'
    why: 'one fixed shape; every actor is declared (unknown_name otherwise)'
  - key: 'then:'
    section: 'Examples'
    means: 'with when: the verdict first, DONE or refused: "<reason>", then facts; without when: facts only'
    why: 'the checker compares; RESULT is what the latest call returned'
  - key: 'notes:'
    section: 'Examples'
    means: 'free text'
    why: 'as on stories'
  - key: 'computed:'
    section: 'Entities'
    means: 'the one key of a computed property, holding its expression'
    why: 'a property that is an expression, never stored'
  - key: 'role:'
    section: 'Entities'
    means: 'in a who-line, the role it admits'
    why: 'one shape for every who-line'
  - key: 'when:'
    section: 'Entities'
    means: 'in a who-line, the condition under which the role is admitted; optional'
    why: 'one shape for every who-line'
  - key: 'when:'
    section: 'Operations'
    means: 'in a refuse item, the condition under which the operation is refused'
    why: 'preconditions with a reason tests match'
  - key: 'reason:'
    section: 'Operations'
    means: 'in a refuse item, the reason given when its condition holds'
    why: 'preconditions with a reason tests match'
  - key: 'fact:'
    section: 'Operations'
    means: 'in an ensure item, the fact as an expression'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'means:'
    section: 'Operations'
    means: 'in an ensure item, the fact''s meaning in words'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'actor:'
    section: 'Examples'
    means: 'in a step''s when, the given actor who asks'
    why: 'one fixed request shape'
  - key: 'call:'
    section: 'Examples'
    means: 'in a step''s when, the call of a declared operation'
    why: 'one fixed request shape'
  - key: 'at:'
    section: 'Examples'
    means: 'in a step''s when, the time of the request; optional'
    why: 'one fixed request shape'
  - key: 'refused:'
    section: 'Examples'
    means: 'the verdict of a refused call, as the first then item, with the reason given'
    why: 'tests match the reason'
  - key: 'roles:'
    section: 'Examples'
    means: 'inside with:, an actor''s roles, a list'
    why: 'the binding reads them'
  - key: 'fixture:'
    section: 'Examples'
    means: 'inside with:, a spec_file''s folder under fixtures/'
    why: 'the binding reads them'
  - key: 'story:'
    section: 'Versions and approval'
    means: 'which story this is a version of; exactly one of story:, entity: and role:'
    why: 'one version, one story or block'
  - key: 'entity:'
    section: 'Versions and approval'
    means: 'which entity block this is a version of'
    why: 'one version, one story or block'
  - key: 'role:'
    section: 'Versions and approval'
    means: 'which role block this is a version of'
    why: 'one version, one story or block'
  - key: 'number:'
    section: 'Versions and approval'
    means: '1, 2, 3 ... per story or block, in file order'
    why: 'bad_version otherwise'
  - key: 'approved_at:'
    section: 'Versions and approval'
    means: 'when, in the time format of 7.2'
    why: 'the audit line'
  - key: 'approved_by:'
    section: 'Versions and approval'
    means: 'who: the operator''s name'
    why: 'the audit line'
  - key: 'because:'
    section: 'Versions and approval'
    means: 'why, one line; optional'
    why: 'the audit line'
  - key: 'pins:'
    section: 'Versions and approval'
    means: 'on a story version: {entity, number} or {role, number} for every block the story names, in story.blocks order, no extras, no duplicates'
    why: 'the fence against a block changing under an approved story'
  - key: 'text:'
    section: 'Versions and approval'
    means: 'the block as approved, normalised'
    why: 'the exact copy'

forms:
  - form: 'order.status, order.shop.name, story.versions[-1].text'
    means: 'reach into an entity or a list element; chains allowed'
    from: 'Python'
  - form: 'x == v, x != v, x < v, x > v, x <= v, x >= v'
    means: 'compare, one operator per comparison: == and != take two values of one kind (None beside anything), two lists compare element by element, < and the rest two numbers, two texts or two times (type_mismatch otherwise)'
    from: 'Python syntax, Edda type rule'
  - form: 'a and b, a or b, not a'
    means: 'logic; not binds tightest, then and, then or; short-circuit; and and or give one of their operands, as in Python, so [1] or [] is a list'
    from: 'Python'
  - form: 'x is None, x is not None'
    means: 'an optional value has no value, has a value'
    from: 'Python'
  - form: 'x in list, x not in list'
    means: 'membership in a list; every value x may be is of the kind of every element (type_mismatch otherwise); a bare choice value in a literal list belongs to the compared property, the other elements are typed as usual'
    from: 'Python syntax, Edda type rule'
  - form: '"t" in text'
    means: 'a text contains a text'
    from: 'Python'
  - form: 'len(x)'
    means: 'the number of elements of a list or characters of a text'
    from: 'Python'
  - form: 'sum(e for x in list), any(c for x in list), all(c for x in list)'
    means: 'the three list words, each with exactly one generator and nothing else; a generator appears nowhere else'
    from: 'Python'
  - form: '[e for x in list if c], [y for x in xs for y in x.ys]'
    means: 'filtered and nested lists; order of the source kept; the variable is a plain name, never a path; never async'
    from: 'Python'
  - form: 'list[0], list[-1], list[n - 1]'
    means: 'index, on a list only (an index on a text is type_mismatch); an index is an INTEGER-valued expression (a constant, a name, a path, or those with + - *), never a yes/no or a NUMBER; out of range fails the example'
    from: 'Python'
  - form: 'story.approved, not fresh.approved'
    means: 'a yes/no property as a condition'
    from: 'Python'
  - form: '+ - * /, ( )'
    means: 'arithmetic; + joins two lists into a new list'
    from: 'Python'
  - form: '"text", \n, \"'
    means: 'a text literal'
    from: 'Python'
  - form: 'TIME("2026-10-03 10:00"), TIME("2026-10-03")'
    means: 'a time: one quoted text literal in the time format of 7.2; any other argument, or a text in another format, is type_mismatch'
    from: 'Python syntax, Edda meaning'
  - form: '3, -2, 1.5, True, False, None, [], [a, b]'
    means: 'integer, number, yes/no, no value (None) and list literals'
    from: 'Python'
  - form: 'NOW, ACTOR, RESULT'
    means: 'the three fixed names: the time, the asker, the latest call''s return'
    from: 'Edda'
  - form: 'OLD(x)'
    means: 'the value before the operation, one argument, only under ensure'
    from: 'Edda, after Eiffel''s old'
  - form: 'len(x)'
    means: 'one argument, no keywords'
    from: 'Python'
  - form: 'check(file), approve(story, because="why")'
    means: 'a declared operation called in Python call form: required inputs by position, optional ones by keyword'
    from: 'Python'

words:
  - word: 'OLD'
    means: 'the value before the operation, only under ensure'
    from: 'Design by Contract'
  - word: 'ACTOR'
    means: 'the asker: name, roles, and the properties of its roles'
    from: 'Edda'
  - word: 'RESULT'
    means: 'what the latest call returned; no value after refused; in scope only in a then item after a call (not_an_expression elsewhere)'
    from: 'Edda'
  - word: 'NOW'
    means: 'the time of the request, in the business zone'
    from: 'Edda'
  - word: 'DONE'
    means: 'the verdict of a successful call, as the first then item, not inside an expression'
    from: 'Edda'
  - word: 'MANY'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'IN ORDER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'DEFAULT'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'OPTIONAL'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'DERIVED'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'TEXT'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'NUMBER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'INTEGER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'TIME'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'YES_NO'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'

refusals:
  - rule: 'not_yaml'
    when: 'the file does not parse'
    message: 'not YAML: <parser message>'
  - rule: 'yaml_feature'
    when: 'an anchor (its aliases with it), tag, directive, <<, complex key, tab, second document, single quotes, a folded scalar, a'
    message: 'scalar outside .vc text, an odd or jumping indentation, an expression, type phrase or example title (as a key or under shown_by:) on more than one line, a quoted key, a key with a space before its colon or an explicit ?, DONE anywhere but first under then, or a role, entity, story, operation or example in flow form (section 2), at its key'
  - rule: 'unquoted_text'
    when: 'free text or an expression written plain'
    message: 'quote the <key>; an unquoted # drops the rest of the line'
  - rule: 'not_a_list'
    when: 'a repeated thing written as a scalar or a mapping, an actor''s roles as one name among them'
    message: '<key> must be a list, one <item> per line, the item being fact, refusal, who-line, given, step, item, note, question, pin, expression, path, rule, example, tag or role'
  - rule: 'wrong_type'
    when: 'a mapping, list or scalar where another is expected; an empty list where one item is needed; a given item without exactly one name; a with value that is not flat; an empty expression or type phrase; a quoted DONE after the first then item; a .vc version or pin naming no block'
    message: '<key> must be a <mapping, list, text, number or yes/no>, or <key> must be a <kind> or a <kind> where the schema allows several; <key> must be a list with at least one <item>; given must name exactly one thing besides with; <key> must be a number, text, yes/no, name or a flat list of those; <key> expects a text, no value was given; <key> expects an expression, not DONE; then must start with DONE or refused for a first then item under a when that is neither; <version> must name one of story or entity or role; <pin> must name one of entity or role'
  - rule: 'missing_key'
    when: 'a required key absent'
    message: '<block> needs <key>:, the block named by kind and name: operation remove, entity order, refusal 2, step 1, file'
  - rule: 'unknown_key'
    when: 'a key the schema does not name'
    message: 'unknown key: <key>'
  - rule: 'bad_name'
    when: 'a name not snake_case, an id not ABC-123, a name, choice value or role-list item that is a Python keyword (True and False as keys included), a quoted name, a quoted DONE as the first then item, a role-list item that is no name'
    message: 'not a name: <text>, the text as written; for a quoted name not a name: "<text>" (a name is plain)'
  - rule: 'declared_twice'
    when: 'a duplicate key, a name declared twice in one project, a given name used twice in one example, a role property named name or roles, an example named twice under a story''s rules:; at the second'
    message: 'declared twice: <name>; for an example, declared twice: <title>'
  - rule: 'unknown_name'
    when: 'an undeclared lowercase word, actor, entity, role, epic, operation, property, fixture or given; a bare name that is neither in scope nor a choice value compared with a choice property; a shown_by title that names no example of the story'
    message: 'unknown name: <name>; for a shown_by title, unknown example: <title>'
  - rule: 'unknown_choice'
    when: 'a choice value that is not one of its property''s values: in a comparison, may_change or a given'
    message: 'not one of <property>''s values: <value>'
  - rule: 'bad_type_phrase'
    when: 'a type phrase outside the grammar'
    message: 'not a type phrase: <text>; with a reason, not a type phrase (<reason>): <text>'
  - rule: 'not_an_expression'
    when: 'a string Python cannot parse, a node outside 7.1, a step in disguise, a changing call inside a fact, a call that is not a call of an operation, RESULT outside a then item after a call (a call itself never sees it)'
    message: 'not an expression: <text>; with a reason, not an expression (<reason>): <text>'
  - rule: 'type_mismatch'
    when: 'a list word on a non-list, len on a number, + between a list and a number, a NUMBER or yes/no as an index, an index on a text, a TIME call whose argument is not one quoted time in the format of 7.2, a comparison of two values of different kinds (==), of a non-element with a list (in) or of anything but two numbers, texts or times (<), a call with the wrong inputs, None for a required input, a value of two possible types where one does not fit, a property read on a non-entity, an unordered list for an IN ORDER input, a choice value outside the expected list, ordered_by on a result that is no list, may_change on a property that is no choice, a given value of another type than its property or fitting none of its possible types'
    message: '<what> expects <kind>: <text>; for a comparison == expects two values of one kind: <text>, in expects an element of the list: <text>, in expects a text in a text: <text>, in expects a list or a text: <text>, < expects two numbers, two texts or two times: <text>; may_change expects a choice property: <property>; TIME expects one quoted time, "YYYY-MM-DD HH:MM" or "YYYY-MM-DD": <text>'
  - rule: 'returns_and_ensure'
    when: 'a read key with a write key, or ordered_by without returns, or also_changes without ensure'
    message: 'returns and ensure on one operation: <name>, returns and also_changes on one operation: <name>, ordered_by needs returns: <name>, also_changes needs ensure: <name>'
  - rule: 'wrong_file'
    when: 'a story in another entity''s file; a part outside its owner''s file'
    message: 'story <id> is about <entity> and belongs in <entity>.edda; entity <name> is part of <owner> and belongs in <entity>.edda'
  - rule: 'not_ordered'
    when: 'RESULT[n] on an unordered return, through an or or comprehension of RESULT as well'
    message: '<operation> gives no order; RESULT[<n>] needs ordered_by or IN ORDER'
  - rule: 'computed_cycle'
    when: 'a computed property whose expression reads itself, directly or through other computed properties (bare in its own entity, through a path into another, or inside the refuse conditions, returns or ordered_by of a called operation, its inputs at their declared types); each group of properties that loop through one another once, at its first property in file-name, then file order'
    message: 'computed properties loop: <a> -> <b> -> <a>, a shortest loop from that first property; each property as <entity>.<property> when the loop crosses entities'
  - rule: 'derived_in_given'
    when: 'a with: value for a derived or computed property, or for an actor''s name'
    message: '<property> is derived and cannot be given, <property> is computed and cannot be given, name is fixed and cannot be given'
  - rule: 'wider_than_entity'
    when: 'who: admits a role the about entity''s matrix never names'
    message: '<operation> admits <role>, which <entity> does not'
  - rule: 'no_rule'
    when: 'a story with rules: has an example no rule names'
    message: 'example "<title>" belongs to no rule'
  - rule: 'bad_version'
    when: 'a .vc number out of sequence, an unknown story or block, or a version of a block of another file'
    message: '<kind> <name> v<n> out of sequence; expected v<m>; for an unknown block, <kind> <name> v<n>: no such <kind>; for another file''s block, <kind> <name> v<n>: belongs in <file>.edda.vc'
  - rule: 'bad_pin'
    when: 'a pin on a block version, a story version without pins, a duplicate (kind, name), a pin to no such block or version; a version exists when a history of the project holds it'
    message: 'pin <kind> <name> v<n>: no such version, pin <kind> <name> v<n>: no such <kind>, pin <kind> <name> v<n>: pinned twice, story <id> v<n>: no pins, <kind> <name> v<n>: a block version has no pins'
  - rule: 'bad_snapshot'
    when: 'a version''s text that is not already normalised, is outside the subset of section 2 or fails the shape layer (a bad name, a wrong key, a duplicate; a retired key of section 10 is not wrong here), does not read as one block under the version''s name, or does not name it on its first line'
    message: 'text of <kind> <name> v<n> is not a normalised block'

flags:
  - rule: 'unreachable_choice'
    when: 'a value of a DEFAULT choice that is neither its default nor the target of a may_change arrow; a choice without DEFAULT has no default and is not looked at'
    message: 'no change reaches <property>''s value: <value>'
  - rule: 'no_example'
    when: 'a story with no example'
    message: 'story <id> has no example'
  - rule: 'question_on_approved'
    when: 'a question on an approved story'
    message: 'story <id> is approved and still has a question'
  - rule: 'wording_drift'
    when: 'section 10'
    message: '<id> <operation>: <side> changed, <other> did not'

sentences:
  - kind: 'story'
    template: '<Story>. As a <role>, I want <i_want>, so that <so_that>.'
  - kind: 'note, question'
    template: 'the text; a story''s notes after the story sentence, then its questions; an operation''s or example''s after its own sentences'
  - kind: 'operation'
    template: '<Name> <is-sentence>.'
  - kind: 'permission'
    template: 'A <role> [whose <actor condition>] may <name> <inputs> [while <state condition>].; the condition is split only at its top-level and: the parts that mention ACTOR go after "whose", the rest after "while"; a condition whose top is not and stays whole, after "whose" if it mentions ACTOR, else after "while"; an input reads as its type with "a" or "an" when its name is its type (order: order reads "an order"), else <name>, a <type>'
  - kind: 'refusal'
    template: 'If <name> is asked for <an input> whose <condition>, then the system shall refuse it: <reason>. when every left side starts with that input''s name, which is then dropped; otherwise If <name> is asked and <condition>, then ...'
  - kind: 'outcome'
    template: 'When <name> succeeds, <means>. or, without means, When <name> succeeds, <fact in words>.'
  - kind: 'read'
    template: '<Name> gives <returns in words>[, ordered by <keys>].'
  - kind: 'invariant'
    template: 'Always, <fact>.'
  - kind: 'rule'
    template: 'Rule: <sentence>. as a heading line before its examples; with rules:, the rules come where the examples stood, in rules order, each followed by its examples in shown_by order; without rules:, no rule sentence and the examples in file order'
  - kind: 'example'
    template: 'Example: <title>.'
  - kind: 'given'
    template: 'one sentence for all givens: Given <item>, and <item>.; an actor reads <name>, a <role>; an entity <name>, a <entity> with <property> <value> and <property> <value>; items are joined with ,  and the last with , and  (the comma stays because each item carries its own apposition)'
  - kind: 'when'
    template: 'When <actor> asks to <name> <arguments>.'
  - kind: 'then'
    template: 'with facts: Then it is done and <facts>. or Then it is refused: <reason>, and <facts>.; without: Then it is done. or Then it is refused: <reason>.; a step without when: Then <facts>.; facts joined with "and"'
