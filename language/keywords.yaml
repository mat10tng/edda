refusals:
  - rule: 'not_yaml'
    when: 'the file does not parse'
    message: 'not YAML: <parser message>'
  - rule: 'yaml_feature'
    when: 'an anchor (its aliases with it), tag, directive, <<, complex key, tab, second document, single quotes, a folded scalar, a block scalar outside .vc text, an odd or jumping indentation, an expression, type phrase or title on more than one line, a quoted key, or DONE anywhere but first under then'
    message: 'anchors and aliases are not allowed (and likewise for each feature); a key is plain, not quoted; DONE is allowed only as the first then item'
  - rule: 'unquoted_text'
    when: 'free text or an expression written plain'
    message: 'quote the <key>; an unquoted # drops the rest of the line'
  - rule: 'not_a_list'
    when: 'a repeated thing written as a scalar or a mapping, an actor''s roles as one name among them'
    message: '<key> must be a list, one <item> per line, the item being fact, refusal, who-line, given, step, item, note, question, pin, expression, path, rule, tag or role'
  - rule: 'wrong_type'
    when: 'a mapping, list or scalar where another is expected; an empty list where one item is needed; a given item without exactly one name; a with value that is not flat; an empty expression or type phrase; a quoted DONE after the first then item; a .vc entry or pin naming no block'
    message: '<key> must be a <mapping/list/text/number/yes-no>, or <key> must be a <kind> or a <kind> where the schema allows several; <key> must be a list with at least one <item>; given must name exactly one thing besides with; <key> must be a number, text, yes/no, name or a flat list of those; <key> expects a text, nothing was given; <key> expects an expression, not DONE; then must start with DONE or refused for a first then item under a when that is neither; <entry> must name one of story or entity or role; <pin> must name one of entity or role'
  - rule: 'missing_key'
    when: 'a required key absent'
    message: '<block> needs <key>:, the block named by kind and name: operation remove, entity order, refusal 2, step 1, file'
  - rule: 'unknown_key'
    when: 'a key the schema does not name'
    message: 'unknown key: <key>'
  - rule: 'bad_name'
    when: 'a name not snake_case, an id not ABC-123, a name, choice value or role-list item that is a Python keyword (True and False as keys included), a quoted name, a quoted DONE as the first then item, a role-list item that is no name'
    message: 'not a name: <text>, the text as written; for a quoted name not a name: "<text>" (a name is plain)'
  - rule: 'declared_twice'
    when: 'a duplicate key, a name declared twice in one project, a given name used twice in one example, a has: entry named name or roles; at the second'
    message: 'declared twice: <name>'
  - rule: 'unknown_name'
    when: 'an undeclared lowercase word, actor, entity, role, epic, operation, property, fixture or given; a bare name that is neither in scope nor a status compared with a choice property'
    message: 'unknown name: <name>'
  - rule: 'unknown_status'
    when: 'a status value not in its property''s list: in a comparison, may_change, wording or a given'
    message: 'status not in its list: <value>'
  - rule: 'bad_type_phrase'
    when: 'a type phrase outside the grammar'
    message: 'not a type phrase: <text>; with a reason, not a type phrase (<reason>): <text>'
  - rule: 'not_an_expression'
    when: 'a string Python cannot parse, a node outside 7.1, a step in disguise, a changing call inside a fact, a call that is not a call of an operation, RESULT outside a then item after a call (a call itself never sees it)'
    message: 'not an expression: <text>; with a reason, not an expression (<reason>): <text>'
  - rule: 'second_way'
    when: 'a form 7.2 spells another way'
    message: 'write <one way> (not <other>)'
  - rule: 'type_mismatch'
    when: 'a list word on a non-list, len on a number, + between a list and a number, a NUMBER or yes/no as an index, an index or slice on a text, a comparison of two values of different kinds (==), of a non-element with a list (in) or of anything but two numbers, texts or times (<), a call with the wrong inputs, None for a required input, a value of two possible types where one does not fit, a property read on a non-entity, an unordered list for an IN ORDER input, a choice value outside the expected list, ordered_by on a result that is no list, may_change or wording on a property that is no choice, a given value of another type than its property or fitting none of its possible types'
    message: '<what> expects <kind>: <text>; for a comparison == expects two values of one kind: <text>, in expects an element of the list: <text>, in expects a text in a text: <text>, in expects a list or a text: <text>, < expects two numbers, two texts or two times: <text>; may_change expects a choice property: <property>'
  - rule: 'returns_and_ensure'
    when: 'a read key with a write key, or ordered_by without returns, or also_changes without ensure'
    message: 'returns and ensure on one operation: <name>, returns and also_changes on one operation: <name>, ordered_by needs returns: <name>, also_changes needs ensure: <name>'
  - rule: 'wrong_file'
    when: 'a story in another entity''s file; a part outside its owner''s file'
    message: 'story <id> is about <entity> and belongs in <entity>.edda; entity <name> is part of <owner> and belongs in <entity>.edda'
  - rule: 'not_ordered'
    when: 'RESULT[n] on an unordered return, through a slice, or or comprehension of RESULT as well'
    message: '<operation> gives no order; RESULT[<n>] needs ordered_by or IN ORDER'
  - rule: 'role_cycle'
    when: 'includes reaches itself; each cycle once, at its first role in file order'
    message: 'role <name> includes itself'
  - rule: 'derived_in_given'
    when: 'a with: value for a derived or computed property, or for an actor''s name'
    message: '<property> is derived and cannot be given, <property> is computed and cannot be given, name is fixed and cannot be given'
  - rule: 'wider_than_entity'
    when: 'who: admits a role the about entity''s matrix never names'
    message: '<operation> admits <role>, which <entity> does not'
  - rule: 'bad_version'
    when: 'a .vc number out of sequence, an unknown story or block, or an entry for a block of another file'
    message: '<kind> <name> version <n> out of sequence; expected <m>; for an unknown block, <kind> <name> version <n>: no such <kind>; for another file''s block, <kind> <name> version <n>: belongs in <file>.edda.vc'
  - rule: 'bad_pin'
    when: 'a pin on a block entry, a story entry without pins, a duplicate (kind, name), a pin to no such block or version; a version exists when a history of the project holds it'
    message: 'pin <kind> <name> v<n>: no such version, pin <kind> <name> v<n>: no such <kind>, pin <kind> <name> v<n>: pinned twice, story <id> version <n>: no pins, <kind> <name> version <n>: a block entry has no pins'
  - rule: 'bad_snapshot'
    when: 'an entry''s text that is not already normalised, is outside the subset of section 2 or fails the shape layer (a bad name, a wrong key, a duplicate), does not read as one block under the entry''s name, or does not name it on its first line'
    message: 'text of <kind> <name> v<n> is not a normalised block'

flags:
  - rule: 'unreachable_status'
    when: 'a status that is neither the default nor the target of a may_change arrow'
    message: 'no change reaches status: <value>'
  - rule: 'no_example'
    when: 'a story with no example'
    message: 'story <id> has no example'
  - rule: 'approved_against_older'
    when: 'a pin older than its block'
    message: '<id> approved against <kind> <name> v<n>, <name> is now v<m>'
  - rule: 'question_on_approved'
    when: 'a question on an approved story'
    message: 'story <id> is approved and still has a question'
  - rule: 'wording_drift'
    when: 'section 10'
    message: '<id> <operation>: <side> changed, <other> did not; for the story pair <id>: rules changed, story sentence did not'
  - rule: 'plural_name'
    when: 'a MANY property with a singular name, or a reference with a plural one'
    message: '<property> holds MANY and should be plural'
  - rule: 'about_untouched'
    when: 'a story that never names its about entity'
    message: 'story <id> is about <entity> but never names it'

sentences:
  - kind: 'story'
    template: '<Story>. As a <role>, I want <i_want>, so that <so_that>.'
  - kind: 'note, question'
    template: 'the text; a story''s notes after the story sentence, then its questions; an operation''s or example''s after its own sentences'
  - kind: 'operation'
    template: '<Name> <is-sentence>.'
  - kind: 'permission'
    template: 'A <role> [whose <actor condition>] may <name> <inputs> [while <state condition>].; the condition is split only at its top-level and: the parts that mention ACTOR go after "whose", the rest after "while"; a condition whose top is not and stays whole, after "whose" if it mentions ACTOR, else after "while"; an input reads as its type with "a" or "an" when its name is its type (order: order reads "an order"), else <name>, a <type>'
  - kind: 'refusal'
    template: 'If <name> is asked for <an input> whose <condition>, then the system shall refuse it: <reason>. when every left side starts with that input''s name, which is then dropped; otherwise If <name> is asked and <condition>, then ...'
  - kind: 'outcome'
    template: 'When <name> succeeds, <means>. or, without means, When <name> succeeds, <fact in words>.'
  - kind: 'read'
    template: '<Name> gives <returns in words>[, ordered by <keys>].'
  - kind: 'invariant'
    template: 'Always, <fact>. and While <condition>, <fact>.'
  - kind: 'example'
    template: 'Example: <title>.'
  - kind: 'given'
    template: 'one sentence for all givens: Given <item>, and <item>.; an actor reads <name>, a <role>; an entity <name>, a <entity> with <property> <value> and <property> <value>; items are joined with ,  and the last with , and  (the comma stays because each item carries its own apposition)'
  - kind: 'when'
    template: 'When <actor> asks to <name> <arguments>.'
  - kind: 'then'
    template: 'with facts: Then it is done and <facts>. or Then it is refused: <reason>, and <facts>.; without: Then it is done. or Then it is refused: <reason>.; a step without when: Then <facts>.; facts joined with "and"'
