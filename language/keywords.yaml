# Edda keyword registry, generated from language/reference.md (revision 47).
# Plain YAML, not a spec file: the .edda subset does not apply here.
# Every key, expression form, style rule, fixed name, checker rule and
# read-view sentence kind, with what it means, why it exists and where it
# comes from. The checker refuses any key not in schema.json, any form not
# here and any second way 7.2 names. Hover text in the views comes
# from means and why. A new entry is added like a rule, with a because.

keys:
  - key: 'roles:'
    section: 'Roles'
    means: 'the kinds of actor, person or program'
    why: 'permissions and stories name roles'
  - key: 'is:'
    section: 'Roles'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'has:'
    section: 'Roles'
    means: 'the properties a holder of this role has, as type phrases'
    why: 'ACTOR.shop == order.shop needs a shop'
  - key: 'includes:'
    section: 'Roles'
    means: 'every permission line admitting those roles admits this one too, condition included; a cycle is role_cycle'
    why: 'RBAC''s role hierarchy'
  - key: 'entities:'
    section: 'Entities'
    means: 'the kinds of business object the system keeps'
    why: 'the glossary; every expression is over declared names'
  - key: 'is:'
    section: 'Entities'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'properties:'
    section: 'Entities'
    means: 'name to type phrase, or {computed: expr}'
    why: 'the shape the checker and the binding read'
  - key: 'part_of:'
    section: 'Entities'
    means: 'this entity belongs to that one'
    why: 'placement and the frame rule follow the owner'
  - key: 'may_change:'
    section: 'Entities'
    means: 'per status property, the only allowed changes; only on a choice property, optional or not (type_mismatch otherwise)'
    why: 'a change outside it fails at run time; an unreached status is flagged'
  - key: 'wording:'
    section: 'Entities'
    means: 'per value and role, the words shown; only on a choice property (type_mismatch otherwise)'
    why: 'the one piece of screen wording kept'
  - key: 'always:'
    section: 'Entities'
    means: 'facts that hold after every operation'
    why: 'invariants checked on the suite'
  - key: 'while:'
    section: 'Entities'
    means: 'when a condition holds, holds a fact'
    why: 'state-bound invariants, EARS WHILE'
  - key: 'may_create:'
    section: 'Entities'
    means: 'who may, as a list of who-lines; a key left out means nobody'
    why: 'the CRUD matrix, default deny'
  - key: 'may_read:'
    section: 'Entities'
    means: 'who may, as a list of who-lines; a key left out means nobody'
    why: 'the CRUD matrix, default deny'
  - key: 'may_update:'
    section: 'Entities'
    means: 'who may, as a list of who-lines; a key left out means nobody'
    why: 'the CRUD matrix, default deny'
  - key: 'may_delete:'
    section: 'Entities'
    means: 'who may, as a list of who-lines; a key left out means nobody'
    why: 'the CRUD matrix, default deny'
  - key: 'epics:'
    section: 'Stories'
    means: 'id to one sentence of intent; no rules'
    why: 'one level above the story, nothing deeper; done when its stories are'
  - key: 'stories:'
    section: 'Stories'
    means: 'id to story'
    why: 'the unit of done, review, version and delivery'
  - key: 'story:'
    section: 'Stories'
    means: 'the sentence'
    why: 'what the customer said'
  - key: 'about:'
    section: 'Stories'
    means: 'the entity it is about'
    why: 'placement, authoritative'
  - key: 'as_a:'
    section: 'Stories'
    means: 'the one role it serves, declared'
    why: 'the read view groups by role'
  - key: 'i_want:'
    section: 'Stories'
    means: 'free text'
    why: 'stored and shown; nothing runs on them'
  - key: 'so_that:'
    section: 'Stories'
    means: 'free text'
    why: 'stored and shown; nothing runs on them'
  - key: 'epic:'
    section: 'Stories'
    means: 'labels'
    why: 'grouping; changeable without a new version'
  - key: 'tags:'
    section: 'Stories'
    means: 'labels'
    why: 'grouping; changeable without a new version'
  - key: 'notes:'
    section: 'Stories'
    means: 'what the grammar cannot say, on a story, an operation or an example; ignored by the checker, grey in the view, collected across files'
    why: 'nothing the customer said is lost; repeated notes are the evidence for a new key'
  - key: 'questions:'
    section: 'Stories'
    means: 'the undecided'
    why: 'a flag on an approved story, never a block'
  - key: 'operations:'
    section: 'Operations'
    means: 'name to operation; one thing an actor can ask for'
    why: 'the anchor the code carries'
  - key: 'is:'
    section: 'Operations'
    means: 'one sentence of what it does; required'
    why: 'heads the operation in the read view; its meaning beside the mechanics'
  - key: 'inputs:'
    section: 'Operations'
    means: 'name to type phrase, in call order; required inputs are passed by position, , OPTIONAL inputs by keyword (remove(purchase, because="moved")) and are None when left out; an input declared MANY ..., IN ORDER takes only an ordered list'
    why: 'the binding and placement need the types'
  - key: 'who:'
    section: 'Operations'
    means: 'list of who-lines; required'
    why: 'no defaults; wider_than_entity when it admits a role the about entity''s matrix never admits'
  - key: 'refuse:'
    section: 'Operations'
    means: 'list of when condition and reason; the first that holds is given'
    why: 'preconditions with a reason tests match'
  - key: 'ensure:'
    section: 'Operations'
    means: 'list of facts true after; a fact is a quoted expression or {fact, means}; may use OLD(...)'
    why: 'postconditions, each with its meaning when the mechanics do not read'
  - key: 'returns:'
    section: 'Operations'
    means: 'the expression a read operation gives back; never with ensure or also_changes (returns_and_ensure)'
    why: 'one word for reads and writes, command-query separation'
  - key: 'ordered_by:'
    section: 'Operations'
    means: 'list of expressions over one result item, reached by its entity''s name, ascending, ties keep input order; only with a returns that is a list (returns_and_ensure without returns, type_mismatch on a result that is no list)'
    why: 'sorts; without it or an IN ORDER source, a positional check on RESULT is not_ordered'
  - key: 'also_changes:'
    section: 'Operations'
    means: 'quoted property paths ("order.history"), each segment resolved from an input, that the frame rule allows to change without an ensure fact; only with ensure (returns_and_ensure otherwise)'
    why: 'everything else stays unchanged'
  - key: 'notes:'
    section: 'Operations'
    means: 'free text'
    why: 'as on stories'
  - key: 'examples:'
    section: 'Examples'
    means: 'quoted title to example; one concrete run'
    why: 'the acceptance criteria that run'
  - key: 'given:'
    section: 'Examples'
    means: 'a list of things to make; each item has exactly one key besides with: - <entity>: <name> or - actor: <name>'
    why: 'order-independent, schema-checked; names declared here are used below; the binding makes them; no glue is written'
  - key: 'with:'
    section: 'Examples'
    means: 'property name to value: a number, quoted text, a quoted time, True, False, a choice value, a given name, or a flat list of those; roles: (a list of role names) for an actor, fixture: for a spec_file only'
    why: 'a property left out takes its DEFAULT, [] for MANY, None for OPTIONAL, otherwise unset: reading it fails the example; a derived or computed property, or an actor''s name, is derived_in_given; every value is checked against the property''s declared type, and a value whose property may be of several types must fit one of them as a whole, a list included: a plain text or time is unquoted_text, the wrong kind type_mismatch, a status not in its list unknown_status, a name no given declares unknown_name; roles: written as one name is not_a_list'
  - key: 'fixture:'
    section: 'Examples'
    means: 'the folder under fixtures/; its file, and its history when present, become the given spec_file'
    why: 'the whole spec is the given, never a hand-made fragment'
  - key: 'steps:'
    section: 'Examples'
    means: 'a list of when and then; when may be left out to check the given state'
    why: 'a flow is several steps'
  - key: 'when:'
    section: 'Examples'
    means: 'actor (a declared given), call (a call of a declared operation with its arguments, Python call form; anything else is not_an_expression), at (optional time)'
    why: 'one fixed shape; every actor is declared (unknown_name otherwise)'
  - key: 'then:'
    section: 'Examples'
    means: 'with when: the outcome first, DONE or refused: "<reason>", then facts; without when: facts only'
    why: 'the checker compares; RESULT is what the latest call returned'
  - key: 'notes:'
    section: 'Examples'
    means: 'free text'
    why: 'as on stories'
  - key: 'computed:'
    section: 'Examples'
    means: 'the one key of a computed property, holding its expression'
    why: 'a property that is an expression, never stored'
  - key: 'when:'
    section: 'Examples'
    means: 'in while: the condition and the fact that holds under it'
    why: 'EARS WHILE'
  - key: 'holds:'
    section: 'Examples'
    means: 'in while: the condition and the fact that holds under it'
    why: 'EARS WHILE'
  - key: 'fact:'
    section: 'Examples'
    means: 'a fact with its meaning in words'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'means:'
    section: 'Examples'
    means: 'a fact with its meaning in words'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'role:'
    section: 'Examples'
    means: 'a who-line: the role and its condition'
    why: 'one shape for every permission'
  - key: 'when:'
    section: 'Examples'
    means: 'a who-line: the role and its condition'
    why: 'one shape for every permission'
  - key: 'actor:'
    section: 'Examples'
    means: 'inside a step''s when: who asks, what, when'
    why: 'one fixed request shape'
  - key: 'call:'
    section: 'Examples'
    means: 'inside a step''s when: who asks, what, when'
    why: 'one fixed request shape'
  - key: 'at:'
    section: 'Examples'
    means: 'inside a step''s when: who asks, what, when'
    why: 'one fixed request shape'
  - key: 'refused:'
    section: 'Examples'
    means: 'a then outcome with the reason given'
    why: 'tests match the reason'
  - key: 'when:'
    section: 'Examples'
    means: 'a refuse item: the condition and the reason given when it holds'
    why: 'preconditions with a reason tests match'
  - key: 'reason:'
    section: 'Examples'
    means: 'a refuse item: the condition and the reason given when it holds'
    why: 'preconditions with a reason tests match'
  - key: 'roles:'
    section: 'Examples'
    means: 'inside with:: an actor''s roles, a spec_file''s folder'
    why: 'the binding reads them'
  - key: 'fixture:'
    section: 'Examples'
    means: 'inside with:: an actor''s roles, a spec_file''s folder'
    why: 'the binding reads them'
  - key: 'story:'
    section: 'Versions and approval'
    means: 'which block this entry is a version of; exactly one'
    why: 'one entry, one block'
  - key: 'entity:'
    section: 'Versions and approval'
    means: 'which block this entry is a version of; exactly one'
    why: 'one entry, one block'
  - key: 'role:'
    section: 'Versions and approval'
    means: 'which block this entry is a version of; exactly one'
    why: 'one entry, one block'
  - key: 'number:'
    section: 'Versions and approval'
    means: '1, 2, 3 ... per story or block, in file order'
    why: 'bad_version otherwise'
  - key: 'approved_at:'
    section: 'Versions and approval'
    means: 'when, who (a name), why; because optional'
    why: 'the audit line'
  - key: 'approved_by:'
    section: 'Versions and approval'
    means: 'when, who (a name), why; because optional'
    why: 'the audit line'
  - key: 'because:'
    section: 'Versions and approval'
    means: 'when, who (a name), why; because optional'
    why: 'the audit line'
  - key: 'pins:'
    section: 'Versions and approval'
    means: 'on a story entry: {entity, number} or {role, number} for every block the story names, in story.blocks order, no extras, no duplicates'
    why: 'the fence against a block changing under an approved story'
  - key: 'text:'
    section: 'Versions and approval'
    means: 'the block as approved, normalised'
    why: 'the exact copy'

forms:
  - form: 'order.status, order.shop.name, story.versions[-1].text'
    means: 'reach into an entity or a list element; chains allowed'
    from: 'Python'
  - form: 'x == v, x != v, x < v, x > v, x <= v, x >= v'
    means: 'compare numbers, times, text, choice values, references and lists; two lists are equal when they have the same elements in the same order; one operator per comparison; == and != take two values of one kind, every value one side may be against every value the other may be (None beside anything; a time literal beside a TIME, inside a list too; two lists whose positions are known position by position, any other pair of lists every element against every element, an IN ORDER list beside an unordered one; a list''s positions are known when it is written out, sliced or joined from such lists with whole-number bounds, -1 included, or a computed property of one, and a conditional of such lists keeps each branch''s positions, a slice, a join and a constant index applying to each branch on its own; a slice of such a list has only the elements it keeps, and a constant index gives the element as written, a computed property''s literals included and each branch of a conditional on its own, in a comparison, as an input, inside another written-out list and under OLD alike, an optional value among them standing only where None fits; a comprehension whose projection is a text literal is a list of such literals of unknown length, compared, indexed and passed as an input like one; a join, a slice with a variable bound and an index that is not a constant keep what the elements may be, literals included, their positions then unknown), < and the rest two numbers, two texts or two times (type_mismatch otherwise)'
    from: 'Python syntax, Edda type rule'
  - form: 'a and b, a or b, not a'
    means: 'logic; not binds tightest, then and, then or; short-circuit; and and or give one of their operands, as in Python, so [1] or [] is a list'
    from: 'Python'
  - form: 'x is None, x is not None'
    means: 'an optional value has no value, has a value'
    from: 'Python'
  - form: 'x in list, x not in list'
    means: 'membership in a list; every value x may be is of the kind of every element (type_mismatch otherwise); a bare status in a literal list belongs to the compared property, the other elements are typed as usual'
    from: 'Python syntax, Edda type rule'
  - form: '"t" in text, text.startswith("t")'
    means: 'a text contains, starts with a text'
    from: 'Python'
  - form: 'len(x)'
    means: 'the number of elements of a list or characters of a text'
    from: 'Python'
  - form: 'sum(e for x in list), min(e for x in list), max(e for x in list), any(c for x in list), all(c for x in list)'
    means: 'the five list words, each with exactly one generator and nothing else; a generator appears nowhere else'
    from: 'Python'
  - form: '[e for x in list if c], [y for x in xs for y in x.ys]'
    means: 'filtered and nested lists; order of the source kept; the variable is a plain name, never a path; never async'
    from: 'Python'
  - form: 'list[0], list[-1], list[n - 1], list[1:], list[:n]'
    means: 'index and slice, on a list only (an index or slice on a text is type_mismatch); an index or bound is an INTEGER-valued expression (a constant, a name, a path, or those with + - *), never a yes/no or a NUMBER; out of range fails the example'
    from: 'Python'
  - form: 'a if c else b'
    means: 'conditional; the untaken side is not evaluated'
    from: 'Python'
  - form: 'story.approved, not fresh.approved'
    means: 'a yes/no property as a condition'
    from: 'Python'
  - form: '+ - * /, ( )'
    means: 'arithmetic; + joins two lists into a new list'
    from: 'Python'
  - form: '"text", \n, \"'
    means: 'a text literal'
    from: 'Python'
  - form: '"2026-10-03 10:00", "2026-10-03"'
    means: 'a time, written as a text literal and read as a TIME where a TIME is expected'
    from: 'Python syntax, Edda meaning'
  - form: '3, -2, 1.5, True, False, None, [], [a, b]'
    means: 'integer, number, yes/no, no-value and list literals'
    from: 'Python'
  - form: 'NOW, TODAY, ACTOR, RESULT'
    means: 'the four fixed names: the time, the day, the asker, the latest call''s return'
    from: 'Edda'
  - form: 'OLD(x)'
    means: 'the value before the operation, one argument, only under ensure'
    from: 'Edda, after Eiffel''s old'
  - form: 'len(x), x.startswith(t)'
    means: 'one argument each, no keywords'
    from: 'Python'
  - form: 'check(file), approve(story, because="why")'
    means: 'a declared operation called in Python call form: required inputs by position, optional ones by keyword'
    from: 'Python'

one_way:
  - meaning: 'a list is empty, not empty'
    write: 'x == [], x != []'
    not: 'len(x) == 0, len(x) != 0, len(x) > 0, not x on a list'
  - meaning: 'the number of elements'
    write: 'len(x)'
    not: 'sum(1 for ...)'
  - meaning: 'the first, the last'
    write: 'x[0], x[-1]'
    not: 'x[len(x) - 1]'
  - meaning: 'no value, a value'
    write: 'x is None, x is not None'
    not: 'x == None, x != None, None == x'
  - meaning: 'a yes/no property holds, does not'
    write: 'x.approved, not x.approved'
    not: 'x.approved == True, x.approved == False, True == x.approved'
  - meaning: 'between'
    write: 'a <= x and x <= b'
    not: 'a <= x <= b and every other comparison chain'
  - meaning: 'text prefix'
    write: 'x.startswith("t")'
    not: 'x[:n] == "t" where "t" has n characters'

words:
  - word: 'OLD'
    means: 'the value before the operation, only under ensure'
    from: 'Design by Contract'
  - word: 'ACTOR'
    means: 'the asker: name, roles, and the has: properties of its roles'
    from: 'Edda'
  - word: 'RESULT'
    means: 'what the latest call returned; no value after refused; in scope only in a then item after a call (not_an_expression elsewhere)'
    from: 'Edda'
  - word: 'NOW'
    means: 'the time and the day of the request, in the business zone'
    from: 'Edda'
  - word: 'TODAY'
    means: 'the time and the day of the request, in the business zone'
    from: 'Edda'
  - word: 'DONE'
    means: 'the outcome of a successful call, as a then item, not inside an expression'
    from: 'Edda'
  - word: 'MANY'
    means: 'type-phrase words, section 4, not inside an expression'
    from: 'Edda'
  - word: 'IN ORDER'
    means: 'type-phrase words, section 4, not inside an expression'
    from: 'Edda'
  - word: 'DEFAULT'
    means: 'type-phrase words, section 4, not inside an expression'
    from: 'Edda'
  - word: 'OPTIONAL'
    means: 'type-phrase words, section 4, not inside an expression'
    from: 'Edda'
  - word: 'DERIVED'
    means: 'type-phrase words, section 4, not inside an expression'
    from: 'Edda'
  - word: 'TEXT'
    means: 'type-phrase words, section 4, not inside an expression'
