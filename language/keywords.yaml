# Edda keyword registry, generated from language/reference.md (revision 73).
# Plain YAML, not a spec file: the .edda subset does not apply here.
# Every key, expression form, fixed name, checker rule and read-view
# sentence kind, with what it means, why it exists and where it comes
# from. The checker refuses any key not in schema.json and any form not
# here. Hover text in the views comes from means and why. A new row is
# added like a rule, with a because. Each rule, the runner's failures
# included, carries its fixed dimensions (category, sub, fix, acts,
# level); dimensions lists the values each may take.

keys:
  - key: 'roles:'
    section: 'Roles'
    means: 'the kinds of actor, person or program'
    why: 'permissions and stories name roles'
  - key: 'is:'
    section: 'Roles'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'properties:'
    section: 'Roles'
    means: 'the properties a holder of this role has, name to type phrase'
    why: 'ACTOR.shop == order.shop needs a shop'
  - key: 'entities:'
    section: 'Entities'
    means: 'the kinds of business object the system keeps'
    why: 'the glossary; every expression is over declared names'
  - key: 'is:'
    section: 'Entities'
    means: 'one sentence of description'
    why: 'the read view'
  - key: 'properties:'
    section: 'Entities'
    means: 'name to type phrase, or {computed: expr}'
    why: 'the shape the checker and the binding read'
  - key: 'part_of:'
    section: 'Entities'
    means: 'this entity belongs to that one'
    why: 'placement and the frame rule follow the owner'
  - key: 'may_change:'
    section: 'Entities'
    means: 'per choice property, optional or not, the only allowed changes from one choice value to others (type_mismatch on a property that is no choice)'
    why: 'a change outside it fails at run time; an unreached value of a choice with DEFAULT is flagged'
  - key: 'always:'
    section: 'Entities'
    means: 'facts that hold after every operation'
    why: 'invariants checked on the suite'
  - key: 'may_create:'
    section: 'Entities'
    means: 'who may create one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_read:'
    section: 'Entities'
    means: 'who may read one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_update:'
    section: 'Entities'
    means: 'who may change one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'may_delete:'
    section: 'Entities'
    means: 'who may delete one, as a list of who-lines; left out, nobody may'
    why: 'the CRUD matrix, default deny'
  - key: 'functions:'
    section: 'Client functions'
    means: 'name to client function: a value Edda cannot compute, which the client''s code provides'
    why: 'anything Edda cannot say is declared, never left implicit (decision EE)'
  - key: 'is:'
    section: 'Client functions'
    means: 'what the function gives, one sentence; required'
    why: 'the read view; its meaning beside its rows'
  - key: 'inputs:'
    section: 'Client functions'
    means: 'name to type phrase, in call order; every input is passed by position'
    why: 'calls are typed against it'
  - key: 'returns:'
    section: 'Client functions'
    means: 'the type phrase of its result'
    why: 'a call has this type'
  - key: 'examples:'
    section: 'Client functions'
    means: 'the rows, at least one, each {given: {<input>: <value>, ...}, gives: <value>}'
    why: 'the function''s contract: they answer for it in examples and are run against the real function'
  - key: 'given:'
    section: 'Client functions'
    means: 'in a row, every input by name, each once, to a value'
    why: 'the row''s inputs'
  - key: 'gives:'
    section: 'Client functions'
    means: 'in a row, the result for those inputs'
    why: 'the row''s result'
  - key: 'epics:'
    section: 'Stories'
    means: 'id to one sentence of intent; no rules'
    why: 'one level above the story, nothing deeper; done when its stories are'
  - key: 'stories:'
    section: 'Stories'
    means: 'id to story'
    why: 'the unit of done, review, version and delivery'
  - key: 'story:'
    section: 'Stories'
    means: 'the sentence'
    why: 'what the customer said'
  - key: 'about:'
    section: 'Stories'
    means: 'the entity it is about'
    why: 'placement, authoritative'
  - key: 'as_a:'
    section: 'Stories'
    means: 'the one role it serves, declared'
    why: 'the read view groups by role'
  - key: 'i_want:'
    section: 'Stories'
    means: 'what the role wants, free text'
    why: 'stored and shown; nothing runs on it'
  - key: 'so_that:'
    section: 'Stories'
    means: 'why the role wants it, free text'
    why: 'stored and shown; nothing runs on it'
  - key: 'epic:'
    section: 'Stories'
    means: 'the id of the epic the story belongs to'
    why: 'grouping; changeable without a new version'
  - key: 'tags:'
    section: 'Stories'
    means: 'a list of labels'
    why: 'grouping; changeable without a new version'
  - key: 'notes:'
    section: 'Stories'
    means: 'what the grammar cannot say, on a story, an operation or an example; ignored by the checker, grey in the view, collected across files'
    why: 'nothing the customer said is lost; repeated notes are the evidence for a new key'
  - key: 'questions:'
    section: 'Stories'
    means: 'the undecided'
    why: 'a flag on an approved story, never a block'
  - key: 'rules:'
    section: 'Stories'
    means: 'optional; a list of rules, each a rule: sentence and the examples that show it; when present, every example of the story is named by exactly one rule (no_rule for one named by none, declared_twice for one named twice, unknown_name for a title that names no example of the story)'
    why: 'Gherkin''s Rule:, with one check: every example belongs to exactly one rule; the layer between the story''s meaning and its examples; decision kb:9378274 entry 100'
  - key: 'rule:'
    section: 'Stories'
    means: 'inside rules:, what the examples under it show, one sentence of free text'
    why: 'the read view heads the examples with it'
  - key: 'shown_by:'
    section: 'Stories'
    means: 'inside rules:, the titles of the examples the rule groups, a list of quoted text'
    why: 'each example tied to the meaning it shows'
  - key: 'operations:'
    section: 'Operations'
    means: 'name to operation; one thing an actor can ask for'
    why: 'the anchor the code carries'
  - key: 'is:'
    section: 'Operations'
    means: 'one sentence of what it does; required'
    why: 'heads the operation in the read view; its meaning beside the mechanics'
  - key: 'inputs:'
    section: 'Operations'
    means: 'name to type phrase, in call order; required inputs are passed by position, , OPTIONAL inputs by keyword (remove(purchase, because="moved")) and are None when left out; an input declared MANY ..., IN ORDER takes only an ordered list'
    why: 'the binding and placement need the types'
  - key: 'who:'
    section: 'Operations'
    means: 'list of who-lines; required'
    why: 'no defaults; wider_than_entity when it admits a role the about entity''s matrix never admits'
  - key: 'refuse:'
    section: 'Operations'
    means: 'list of when condition and reason; the first that holds is given'
    why: 'preconditions with a reason tests match'
  - key: 'ensure:'
    section: 'Operations'
    means: 'list of facts true after; a fact is a quoted expression or {fact, means}; may use OLD(...)'
    why: 'postconditions, each with its meaning when the mechanics do not read'
  - key: 'returns:'
    section: 'Operations'
    means: 'the expression a read operation gives back; never with ensure or also_changes (returns_and_ensure)'
    why: 'one word for reads and writes, command-query separation'
  - key: 'ordered_by:'
    section: 'Operations'
    means: 'list of expressions over one result item, reached by its entity''s name, ascending, ties keep input order; only with a returns that is a list (returns_and_ensure without returns, type_mismatch on a result that is no list)'
    why: 'sorts; without it or an IN ORDER source, a positional check on RESULT is not_ordered'
  - key: 'also_changes:'
    section: 'Operations'
    means: 'quoted property paths ("order.history"), each segment resolved from an input, that the frame rule allows to change without an ensure fact; only with ensure (returns_and_ensure otherwise)'
    why: 'everything else stays unchanged'
  - key: 'notes:'
    section: 'Operations'
    means: 'free text'
    why: 'as on stories'
  - key: 'examples:'
    section: 'Examples'
    means: 'quoted title to example; one concrete run'
    why: 'the acceptance criteria that run'
  - key: 'starts_at:'
    section: 'Examples'
    means: 'the example''s start, a quoted time (7.2); only on an example that uses time'
    why: 'the clock it runs on (below); left out, the project''s clock_start: (section 9); an example that uses time with neither is no_clock_start, and a starts_at: on one that does not is flagged clock_unused'
  - key: 'given:'
    section: 'Examples'
    means: 'a list of things to make; each item has exactly one key besides with: - <entity>: <name> or - actor: <name>'
    why: 'order-independent, schema-checked; names declared here are used below; the binding makes them (section 9); no glue is written'
  - key: 'with:'
    section: 'Examples'
    means: 'property name to value: a number, quoted text, a quoted time, True, False, a choice value, a given name, or a flat list of those; roles: (a list of role names) for an actor, fixture: for a spec_file only'
    why: 'a property left out takes its DEFAULT, [] for MANY, None for OPTIONAL, otherwise unset: reading it fails the example; a derived or computed property, or an actor''s name, is derived_in_given; every value is checked against the property''s declared type, and a value whose property may be of several types must fit one of them as a whole, a list included: a plain text or time is unquoted_text, the wrong kind type_mismatch, a choice value not one of its property''s values unknown_choice, a name no given declares unknown_name; roles: written as one name is not_a_list'
  - key: 'fixture:'
    section: 'Examples'
    means: 'the folder under fixtures/; its file, and its history when present, become the given spec_file'
    why: 'the whole spec is the given, never a hand-made fragment'
  - key: 'steps:'
    section: 'Examples'
    means: 'a list of when and then; when may be left out to check the given state'
    why: 'a flow is several steps'
  - key: 'when:'
    section: 'Examples'
    means: 'actor (a declared given), call (a call of a declared operation with its arguments, Python call form; anything else is not_an_expression), at (optional: a time, or NOW moved by durations; it moves the example''s clock, below)'
    why: 'one fixed shape; every actor is declared (unknown_name otherwise)'
  - key: 'then:'
    section: 'Examples'
    means: 'with when: the verdict first, DONE or refused: "<reason>", then facts; without when: facts only'
    why: 'the checker compares; RESULT is what the latest call returned'
  - key: 'notes:'
    section: 'Examples'
    means: 'free text'
    why: 'as on stories'
  - key: 'computed:'
    section: 'Entities'
    means: 'the one key of a computed property, holding its expression'
    why: 'a property that is an expression, never stored'
  - key: 'role:'
    section: 'Entities'
    means: 'in a who-line, the role it admits'
    why: 'one shape for every who-line'
  - key: 'when:'
    section: 'Entities'
    means: 'in a who-line, the condition under which the role is admitted; optional'
    why: 'one shape for every who-line'
  - key: 'when:'
    section: 'Operations'
    means: 'in a refuse item, the condition under which the operation is refused'
    why: 'preconditions with a reason tests match'
  - key: 'reason:'
    section: 'Operations'
    means: 'in a refuse item, the reason given when its condition holds'
    why: 'preconditions with a reason tests match'
  - key: 'fact:'
    section: 'Operations'
    means: 'in an ensure item, the fact as an expression'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'means:'
    section: 'Operations'
    means: 'in an ensure item, the fact''s meaning in words'
    why: 'the meaning beside the mechanics (decision 40)'
  - key: 'actor:'
    section: 'Examples'
    means: 'in a step''s when, the given actor who asks'
    why: 'one fixed request shape'
  - key: 'call:'
    section: 'Examples'
    means: 'in a step''s when, the call of a declared operation'
    why: 'one fixed request shape'
  - key: 'at:'
    section: 'Examples'
    means: 'in a step''s when, the time of the request: a quoted time, or NOW moved by durations; optional; it moves the example''s clock'
    why: 'one fixed request shape; one key moves time, never a separate set and advance'
  - key: 'refused:'
    section: 'Examples'
    means: 'the verdict of a refused call, as the first then item, with the reason given'
    why: 'tests match the reason'
  - key: 'roles:'
    section: 'Examples'
    means: 'inside with:, an actor''s roles, a list'
    why: 'the binding reads them'
  - key: 'fixture:'
    section: 'Examples'
    means: 'inside with:, a spec_file''s folder under fixtures/'
    why: 'the binding reads them'
  - key: 'target:'
    section: 'Level 2: links and binding'
    means: 'the code''s stack; python is the one known'
    why: 'the naming rule and the markers are per stack'
  - key: 'rule:'
    section: 'Level 2: links and binding'
    means: 'the naming rule; same_name: an operation''s function is the covered top-level function of its snake_case name'
    why: 'most operations need no line in a .links'
  - key: 'covers:'
    section: 'Level 2: links and binding'
    means: 'the code files the link check reads, each a .py file relative to the project''s root (Settings, below): the folder that holds edda.yaml, or with no edda.yaml the folder above the spec folder (the repository, for specs/); each must resolve inside the root'
    why: 'markers are read, and code no story reaches is flagged, only there'
  - key: 'links:'
    section: 'Level 2: links and binding'
    means: 'in an <entity>.links: operation name to "path::function", a top-level function in a covered file, or to NOT_BUILT'
    why: 'the operations that do not follow the rule'
  - key: 'edda:'
    section: 'Settings'
    means: 'at the root of edda.yaml; the revision of Edda the project is written against, a whole number of at least 1; left out, no pin'
    why: 'tools older than the pin refuse to run; newer ones say so and run'
  - key: 'specs:'
    section: 'Settings'
    means: 'at the root of edda.yaml; the spec folder, a path relative to the root and inside it (no .., not absolute, and resolving inside the root once symlinks are followed); specs when left out'
    why: 'a project keeps its stories where it chooses'
  - key: 'stack:'
    section: 'Settings'
    means: 'at the root of edda.yaml; the code stack, python the one known; left out, none is named'
    why: 'the import names the stack once; a glossary.links that names another target: is refused'
  - key: 'problem_log:'
    section: 'Settings'
    means: 'at the root of edda.yaml; local or off; left out, or no file, off; with local the checker and the runner append each problem to .edda/checks.log, which edda trend reads (section 11)'
    why: 'a KB is the main home of a project''s history and reads edda --json (section 13); a project keeps a history of its own only when it asks for one (decision HH)'
  - key: 'generated_cases:'
    section: 'Settings'
    means: 'at the root of edda.yaml; a mapping; left out, or no file, generated cases are off'
    why: 'one switch per project, off unless asked for'
  - key: 'on:'
    section: 'Settings'
    means: 'inside generated_cases:, required; a yes/no; no default'
    why: 'turning them on is a choice written down, never implied'
  - key: 'runs:'
    section: 'Settings'
    means: 'inside generated_cases:; a whole number of at least 1; 100 when left out'
    why: 'how many random runs a story gets'
  - key: 'steps:'
    section: 'Settings'
    means: 'inside generated_cases:; a whole number of at least 1; 20 when left out'
    why: 'how many calls a run may make at most'
  - key: 'zone:'
    section: 'Settings'
    means: 'at the root of edda.yaml; the business zone, a time zone name Python''s zoneinfo knows, such as Europe/Oslo; UTC when left out, or with no file; any other value is refused (wrong_type)'
    why: 'NOW, TODAY and DAYS mean one calendar in every example (7.2)'
  - key: 'clock_start:'
    section: 'Settings'
    means: 'at the root of edda.yaml; a time (7.2), quoted: the start of the clock of every example that uses time and has no starts_at:, and of generated cases; left out, none; a value that is no time is refused (wrong_type)'
    why: 'one start for a project''s examples, each free to give its own (section 8)'
  - key: 'story:'
    section: 'Versions and approval'
    means: 'which story this is a version of; exactly one of story:, entity:, role: and function:'
    why: 'one version, one story or block'
  - key: 'entity:'
    section: 'Versions and approval'
    means: 'which entity block this is a version of'
    why: 'one version, one story or block'
  - key: 'role:'
    section: 'Versions and approval'
    means: 'which role block this is a version of'
    why: 'one version, one story or block'
  - key: 'function:'
    section: 'Versions and approval'
    means: 'which client function block this is a version of'
    why: 'one version, one story or block'
  - key: 'number:'
    section: 'Versions and approval'
    means: '1, 2, 3 ... per story or block, in file order'
    why: 'bad_version otherwise'
  - key: 'approved_at:'
    section: 'Versions and approval'
    means: 'when, in the time format of 7.2'
    why: 'the audit line'
  - key: 'approved_by:'
    section: 'Versions and approval'
    means: 'who: the operator''s name'
    why: 'the audit line'
  - key: 'because:'
    section: 'Versions and approval'
    means: 'why, one line; optional'
    why: 'the audit line'
  - key: 'pins:'
    section: 'Versions and approval'
    means: 'on a story version: {entity, number}, {role, number} or {function, number} for every block the story names, in story.blocks order, no extras, no duplicates'
    why: 'the fence against a block changing under an approved story'
  - key: 'text:'
    section: 'Versions and approval'
    means: 'the block as approved, normalised'
    why: 'the exact copy'

forms:
  - form: 'order.status, order.shop.name, story.versions[-1].text'
    means: 'reach into an entity or a list element; chains allowed'
    from: 'Python'
  - form: 'x == v, x != v, x < v, x > v, x <= v, x >= v'
    means: 'compare, one operator per comparison: == and != take two values of one kind (None beside anything), two lists compare element by element, < and the rest two numbers, two texts or two times (type_mismatch otherwise)'
    from: 'Python syntax, Edda type rule'
  - form: 'a and b, a or b, not a'
    means: 'logic; not binds tightest, then and, then or; short-circuit; and and or give one of their operands, as in Python, so [1] or [] is a list'
    from: 'Python'
  - form: 'x is None, x is not None'
    means: 'an optional value has no value, has a value'
    from: 'Python'
  - form: 'x in list, x not in list'
    means: 'membership in a list; every value x may be is of the kind of every element (type_mismatch otherwise); a bare choice value in a literal list belongs to the compared property, the other elements are typed as usual'
    from: 'Python syntax, Edda type rule'
  - form: '"t" in text'
    means: 'a text contains a text'
    from: 'Python'
  - form: 'len(x)'
    means: 'the number of elements of a list or characters of a text'
    from: 'Python'
  - form: 'sum(e for x in list), any(c for x in list), all(c for x in list)'
    means: 'the three list words, each with exactly one generator and nothing else; a generator appears nowhere else'
    from: 'Python'
  - form: '[e for x in list if c], [y for x in xs for y in x.ys]'
    means: 'filtered and nested lists; order of the source kept; the variable is a plain name, never a path; never async'
    from: 'Python'
  - form: 'list[0], list[-1], list[n - 1]'
    means: 'index, on a list only (an index on a text is type_mismatch); an index is an INTEGER-valued expression (a constant, a name, a path, or those with + - *), never a yes/no or a NUMBER; out of range fails the example'
    from: 'Python'
  - form: 'story.approved, not fresh.approved'
    means: 'a yes/no property as a condition'
    from: 'Python'
  - form: '+ - * /, ( )'
    means: 'arithmetic; + joins two lists into a new list'
    from: 'Python'
  - form: '"text", \n, \"'
    means: 'a text literal'
    from: 'Python'
  - form: 'TIME("2026-10-03 10:00"), TIME("2026-10-03")'
    means: 'a time: one quoted text literal in the time format of 7.2; any other argument, or a text in another format, is type_mismatch'
    from: 'Python syntax, Edda meaning'
  - form: 'NOW + DAYS(1), order.due - HOURS(2), NOW + MINUTES(n)'
    means: 'a time moved by a duration, giving a time: DAYS(n) n calendar days in the business zone, the same wall-clock time across a daylight-saving change; HOURS(n) and MINUTES(n) elapsed time; a count of 0 leaves the time as it is; n an INTEGER expression; only TIME + duration and TIME - duration, in any expression slot; a duration anywhere else, or a count that is no INTEGER, is type_mismatch'
    from: 'Python syntax, Edda meaning (decision Z)'
  - form: '3, -2, 1.5, True, False, None, [], [a, b]'
    means: 'integer, number, yes/no, no value (None) and list literals'
    from: 'Python'
  - form: 'NOW, TODAY, ACTOR, RESULT'
    means: 'the four fixed names: the time, the day, the asker, the latest call''s return'
    from: 'Edda'
  - form: 'OLD(x)'
    means: 'the value before the operation, one argument, only under ensure'
    from: 'Edda, after Eiffel''s old'
  - form: 'len(x)'
    means: 'one argument, no keywords'
    from: 'Python'
  - form: 'check(file), approve(story, because="why")'
    means: 'a declared operation called in Python call form: required inputs by position, optional ones by keyword'
    from: 'Python'
  - form: 'shipping_cost(order.weight)'
    means: 'a client function (section 4) called in Python call form, every input by position, no keyword; its type is its returns'
    from: 'Python syntax, Edda meaning (decision EE)'

words:
  - word: 'OLD'
    means: 'the value before the operation, only under ensure'
    from: 'Design by Contract'
  - word: 'ACTOR'
    means: 'the asker: name, roles, and the properties of its roles'
    from: 'Edda'
  - word: 'RESULT'
    means: 'what the latest call returned; no value after refused; in scope only in a then item after a call (not_an_expression elsewhere)'
    from: 'Edda'
  - word: 'NOW'
    means: 'the clock''s time, in the business zone: the example''s start, moved only by a step''s at: (section 8); in generated cases the project''s clock_start:; never the machine''s clock'
    from: 'Edda (decision FF)'
  - word: 'TODAY'
    means: 'the day of NOW in the business zone: the time 00:00 that day, the same value as TIME("YYYY-MM-DD") for that date'
    from: 'Edda (decision GG)'
  - word: 'DAYS'
    means: 'durations, only as TIME + DAYS(n) or TIME - DAYS(n) (7.1): a day a calendar day, an hour or a minute elapsed time'
    from: 'Edda (decision Z)'
  - word: 'HOURS'
    means: 'durations, only as TIME + DAYS(n) or TIME - DAYS(n) (7.1): a day a calendar day, an hour or a minute elapsed time'
    from: 'Edda (decision Z)'
  - word: 'MINUTES'
    means: 'durations, only as TIME + DAYS(n) or TIME - DAYS(n) (7.1): a day a calendar day, an hour or a minute elapsed time'
    from: 'Edda (decision Z)'
  - word: 'DONE'
    means: 'the verdict of a successful call, as the first then item, not inside an expression'
    from: 'Edda'
  - word: 'MANY'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'IN ORDER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'DEFAULT'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'OPTIONAL'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'DERIVED'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'TEXT'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'NUMBER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'INTEGER'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'TIME'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'
  - word: 'YES_NO'
    means: 'type-phrase words, section 4, not inside an expression, except TIME("...") (7.1)'
    from: 'Edda'

refusals:
  - rule: 'not_yaml'
    when: 'the file does not parse'
    message: 'not YAML: <parser message>'
    category: 'unreadable'
    sub: 'syntax'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'yaml_feature'
    when: 'an anchor (its aliases with it), tag, directive, <<, complex key, tab, second document, single quotes, a folded scalar, a'
    message: 'scalar outside .vc text, an odd or jumping indentation, an expression, type phrase or example title (as a key or under shown_by:) on more than one line, a quoted key, a key with a space before its colon or an explicit ?, DONE anywhere but first under then, or a role, entity, story, operation or example in flow form (section 2), at its key'
    category: 'unreadable'
    sub: 'banned YAML'
    fix: 'extra'
    acts: 'agent'
    level: 'blocks'
  - rule: 'unquoted_text'
    when: 'free text or an expression written plain'
    message: 'quote the <key>; an unquoted # drops the rest of the line'
    category: 'unreadable'
    sub: 'quoting'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'not_a_list'
    when: 'a repeated thing written as a scalar or a mapping, an actor''s roles as one name among them'
    message: '<key> must be a list, one <item> per line, the item being fact, refusal, who-line, given, step, item, note, question, pin, expression, path, rule, example, tag or role'
    category: 'unreadable'
    sub: 'shape'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'wrong_type'
    when: 'a mapping, list or scalar where another is expected; an empty list where one item is needed; a given item without exactly one name; a with value that is not flat; an empty expression or type phrase; a quoted DONE after the first then item; a .vc version or pin naming no block'
    message: '<key> must be a <mapping, list, text, number or yes/no>, or <key> must be a <kind> or a <kind> where the schema allows several; <key> must be a list with at least one <item>; given must name exactly one thing besides with; <key> must be a number, text, yes/no, name or a flat list of those; <key> expects a text, no value was given; <key> expects an expression, not DONE; then must start with DONE or refused for a first then item under a when that is neither; <version> must name one of story or entity or role; <pin> must name one of entity or role'
    category: 'unreadable'
    sub: 'shape'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'missing_key'
    when: 'a required key absent; an input a function''s row leaves out'
    message: '<block> needs <key>:, the block named by kind and name: operation remove, entity order, refusal 2, step 1, row 2, file'
    category: 'unreadable'
    sub: 'shape'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'unknown_key'
    when: 'a key the schema does not name; an input a function''s row names that the function has not'
    message: 'unknown key: <key>'
    category: 'unreadable'
    sub: 'shape'
    fix: 'extra'
    acts: 'agent'
    level: 'blocks'
  - rule: 'bad_name'
    when: 'a name not snake_case, an id not ABC-123, a name, choice value or role-list item that is a Python keyword (True and False as keys included), a quoted name, a quoted DONE as the first then item, a role-list item that is no name'
    message: 'not a name: <text>, the text as written; for a quoted name not a name: "<text>" (a name is plain)'
    category: 'unknown word'
    sub: 'spelling'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'declared_twice'
    when: 'a duplicate key, a name declared twice in one project, a function name that is also a role, entity, operation or function, or one of Edda''s own words, a given name used twice in one example, a role property named name or roles, an example named twice under a story''s rules:; at the second'
    message: 'declared twice: <name>; for an example, declared twice: <title>; for one of Edda''s own words, declared twice: <name> (a word of Edda''s own)'
    category: 'unknown word'
    sub: 'twice'
    fix: 'extra'
    acts: 'agent'
    level: 'blocks'
  - rule: 'unknown_name'
    when: 'an undeclared lowercase word, actor, entity, role, epic, operation, property, fixture or given; a bare name that is neither in scope nor a choice value compared with a choice property; a shown_by title that names no example of the story'
    message: 'unknown name: <name>; for a shown_by title, unknown example: <title>'
    category: 'unknown word'
    sub: 'undeclared'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'unknown_choice'
    when: 'a choice value that is not one of its property''s values: in a comparison, may_change or a given'
    message: 'not one of <property>''s values: <value>'
    category: 'unknown word'
    sub: 'not in list'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'bad_type_phrase'
    when: 'a type phrase outside the grammar; a function''s input or result that is not TEXT, NUMBER, INTEGER, TIME, YES_NO or a choice'
    message: 'not a type phrase: <text>; with a reason, not a type phrase (<reason>): <text>, for a function''s not a type phrase (a function takes and gives TEXT, NUMBER, INTEGER, TIME, YES_NO or a choice): <text>'
    category: 'wrong kind'
    sub: 'type phrase'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'not_an_expression'
    when: 'a string Python cannot parse, a node outside 7.1, a step in disguise, a changing call inside a fact, a call that is not a call of an operation, RESULT outside a then item after a call (a call itself never sees it)'
    message: 'not an expression: <text>; with a reason, not an expression (<reason>): <text>'
    category: 'wrong kind'
    sub: 'outside whitelist'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'type_mismatch'
    when: 'a list word on a non-list, len on a number, + between a list and a number, a NUMBER or yes/no as an index, an index on a text, a TIME call whose argument is not one quoted time in the format of 7.2, a comparison of two values of different kinds (==), of a non-element with a list (in) or of anything but two numbers, texts or times (<), a call with the wrong inputs, None for a required input, a value of two possible types where one does not fit, a property read on a non-entity, an unordered list for an IN ORDER input, a choice value outside the expected list, ordered_by on a result that is no list, may_change on a property that is no choice, a given value of another type than its property or fitting none of its possible types, a duration (DAYS, HOURS, MINUTES) anywhere but after TIME + or TIME - or with a count that is no INTEGER, an at: that is neither a time nor NOW moved by durations, a starts_at: that is no time, a client function called with a keyword or the wrong inputs, a row''s value of another type than its input or result, or a row''s time that is no time'
    message: '<what> expects <kind>: <text>; for a comparison == expects two values of one kind: <text>, in expects an element of the list: <text>, in expects a text in a text: <text>, in expects a list or a text: <text>, < expects two numbers, two texts or two times: <text>; may_change expects a choice property: <property>; TIME expects one quoted time, "YYYY-MM-DD HH:MM" or "YYYY-MM-DD": <text>; DAYS expects to move a time, as TIME + DAYS(n) or TIME - DAYS(n): <text>, DAYS expects one INTEGER: <text> (and so for HOURS and MINUTES); at expects a time, "YYYY-MM-DD HH:MM", or NOW moved by DAYS, HOURS or MINUTES: <text>; starts_at expects a time, "YYYY-MM-DD HH:MM" or "YYYY-MM-DD": <text>'
    category: 'wrong kind'
    sub: 'types'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'returns_and_ensure'
    when: 'a read key with a write key, or ordered_by without returns, or also_changes without ensure'
    message: 'returns and ensure on one operation: <name>, returns and also_changes on one operation: <name>, ordered_by needs returns: <name>, also_changes needs ensure: <name>'
    category: 'misplaced'
    sub: 'read and change'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'wrong_file'
    when: 'a story in another entity''s file; a part outside its owner''s file'
    message: 'story <id> is about <entity> and belongs in <entity>.edda; entity <name> is part of <owner> and belongs in <entity>.edda'
    category: 'misplaced'
    sub: 'file'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'not_ordered'
    when: 'RESULT[n] on an unordered return, through an or or comprehension of RESULT as well'
    message: '<operation> gives no order; RESULT[<n>] needs ordered_by or IN ORDER'
    category: 'wrong kind'
    sub: 'order assumed'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'computed_cycle'
    when: 'a computed property whose expression reads itself, directly or through other computed properties (bare in its own entity, through a path into another, or inside the refuse conditions, returns or ordered_by of a called operation, its inputs at their declared types); each group of properties that loop through one another once, at its first property in file-name, then file order'
    message: 'computed properties loop: <a> -> <b> -> <a>, a shortest loop from that first property; each property as <entity>.<property> when the loop crosses entities'
    category: 'misplaced'
    sub: 'computed loop'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'derived_in_given'
    when: 'a with: value for a derived or computed property, or for an actor''s name'
    message: '<property> is derived and cannot be given, <property> is computed and cannot be given, name is fixed and cannot be given'
    category: 'wrong kind'
    sub: 'given a computed'
    fix: 'extra'
    acts: 'agent'
    level: 'blocks'
  - rule: 'wider_than_entity'
    when: 'who: admits a role the about entity''s matrix never names'
    message: '<operation> admits <role>, which <entity> does not'
    category: 'misplaced'
    sub: 'permission scope'
    fix: 'extra'
    acts: 'person'
    level: 'blocks'
  - rule: 'no_rule'
    when: 'a story with rules: has an example no rule names'
    message: 'example "<title>" belongs to no rule'
    category: 'misplaced'
    sub: 'example ungrouped'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'contradicting_rows'
    when: 'two rows of a client function with the same inputs and different results, values compared as values (section 4), judged once every row''s values check; at the later row'
    message: '<function>: rows <i> and <j> give different results for the same inputs'
    category: 'contradiction'
    sub: 'function rows'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'no_clock_start'
    when: 'an example that uses time (section 8) with no starts_at: and no project clock_start:'
    message: 'example "<title>" uses time (<how>) but has no start; give it starts_at: or the project clock_start:, <how> the first use found: reads NOW, moves time with at:, reads <entity>.<property>, which reads the clock or calls <operation>, which reads the clock'
    category: 'weak check'
    sub: 'no clock start'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'clock_backwards'
    when: 'an at: the checker can tell is earlier than the clock before it (section 8)'
    message: 'at <at> is before the clock''s <time>; time never goes backwards, an expression followed by its time in brackets'
    category: 'contradiction'
    sub: 'time backwards'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'bad_version'
    when: 'a .vc number out of sequence, an unknown story or block, or a version of a block of another file'
    message: '<kind> <name> v<n> out of sequence; expected v<m>; for an unknown block, <kind> <name> v<n>: no such <kind>; for another file''s block, <kind> <name> v<n>: belongs in <file>.edda.vc'
    category: 'out of date'
    sub: 'history broken'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'bad_pin'
    when: 'a pin on a block version, a story version without pins, a duplicate (kind, name), a pin to no such block or version; a version exists when a history of the project holds it'
    message: 'pin <kind> <name> v<n>: no such version, pin <kind> <name> v<n>: no such <kind>, pin <kind> <name> v<n>: pinned twice, story <id> v<n>: no pins, <kind> <name> v<n>: a block version has no pins'
    category: 'out of date'
    sub: 'history broken'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'bad_snapshot'
    when: 'a version''s text that is not already normalised, is outside the subset of section 2 or fails the shape layer (a bad name, a wrong key, a duplicate; a retired key of section 10 is not wrong here), does not read as one block under the version''s name, or does not name it on its first line'
    message: 'text of <kind> <name> v<n> is not a normalised block'
    category: 'out of date'
    sub: 'history broken'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'unknown_link'
    when: 'a .links naming no known target or rule, no .py file, a file Python cannot read, no .edda beside it, no operation of that file or a file it does not cover; an exception written neither "path::function" nor NOT_BUILT; a marker naming no story'
    message: 'unknown target: <x>, unknown naming rule: <x>, no such Python file: <path>, not Python (<reason>): <path>, no such file: <entity>.edda, unknown operation: <name>, not a covered file: <path>, not a link (write "path::function" or NOT_BUILT): <text>, unknown story: <id>'
    category: 'unknown word'
    sub: 'link name'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'no_function'
    when: 'an operation that resolves to no function or to two: an exception naming a function its file does not have; by the rule, no covered file, or more than one, with a top-level function of its name'
    message: 'no function <function> in <path>[, replaced by <how> at line <m>], no function <operation> for <id> in the covered files[ (<path>::<operation>, replaced by <how> at line <m>)], two functions for <operation> of <id>: <path>::<function>, ...; name one in <entity>.links'
    category: 'code differs'
    sub: 'no function'
    fix: 'missing'
    acts: 'agent'
    level: 'blocks'
  - rule: 'pinned_newer'
    when: 'an edda.yaml pinning a revision newer than the tools (section 9)'
    message: 'edda.yaml pins revision <n>; these tools are revision <m>'
    category: 'out of date'
    sub: 'pin ahead'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'stack_mismatch'
    when: 'an edda.yaml whose stack: differs from the target: of the spec folder''s glossary.links'
    message: 'stack is <stack> but <glossary.links> names target <target>'
    category: 'contradiction'
    sub: 'stack'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'two_settings'
    when: 'an edda.yaml at the root and one in the spec folder, at the second'
    message: 'two edda.yaml files; keep <edda.yaml> and move generated_cases: into it'
    category: 'misplaced'
    sub: 'settings file'
    fix: 'extra'
    acts: 'agent'
    level: 'blocks'
  - rule: 'outside_root'
    when: 'a path the host gives that resolves, symlinks followed, outside the project''s root: the spec folder, the log folder .edda (when the log is on), a covers: path, or a file a tool opens under the root (edda.yaml, a .edda, .edda.vc or .links file; section 9)'
    message: '<what> resolves outside the project root: <resolved path>, <what> being the spec folder, the log folder .edda, the covers: path or the file''s name'
    category: 'misplaced'
    sub: 'outside root'
    fix: 'wrong'
    acts: 'person'
    level: 'blocks'
  - rule: 'bad_marker'
    when: 'a comment that starts like a marker but is not # <STORY-ID>@<n>; a marker not on a line of its own directly above a top-level function; a version its story does not have; one story twice on one function; a marker above a function doing none of its story''s operations; a function doing an operation without its story''s marker; a marker on a def that a later binding of its name replaces, one every import runs: a direct top-level statement, or in a branch proven to run (section 9)'
    message: 'not a marker (write # <STORY-ID>@<version>): <text>, a marker is a line of its own directly above a function: <text>, <function> at line <n> is replaced by a def, a class or a binding at line <m>, so the marker is on code that does not run: <text>, <id> has no version <n>, marked twice: <id> on <function>, <function> does no operation of <id>, <function> does <operation> of <id> and carries no # <id>@<version>'
    category: 'code differs'
    sub: 'marker'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'

flags:
  - rule: 'unreachable_choice'
    when: 'a value of a DEFAULT choice that is neither its default nor the target of a may_change arrow; a choice without DEFAULT has no default and is not looked at'
    message: 'no change reaches <property>''s value: <value>'
    category: 'contradiction'
    sub: 'status rules'
    fix: 'missing'
    acts: 'person'
    level: 'warns'
  - rule: 'no_example'
    when: 'a story with no example'
    message: 'story <id> has no example'
    category: 'weak check'
    sub: 'no example'
    fix: 'missing'
    acts: 'agent'
    level: 'warns'
  - rule: 'dead_refusal'
    when: 'a refusal that can never be the one given: every case it covers, an earlier refusal of the operation already covers (the analyser, below)'
    message: '<operation>: refusal <n> can never be given; refusal <m> covers it; with more, refusals <m> and <k> cover it, only the earlier refusals needed'
    category: 'contradiction'
    sub: 'refusals'
    fix: 'extra'
    acts: 'person'
    level: 'warns'
  - rule: 'conflicting_ensure'
    when: 'two ensure facts of one operation on the same property with no case in common, or an ensure fact with no case in common with an always fact of an entity it reaches (the analyser, below)'
    message: '<operation>: ensure <i> and ensure <j> cannot both hold; <operation>: ensure <i> cannot hold with always <k> of <entity>: <fact>'
    category: 'contradiction'
    sub: 'ensures'
    fix: 'wrong'
    acts: 'person'
    level: 'warns'
  - rule: 'empty_ensure'
    when: 'an ensure fact that cannot fail: one comparison ==, >= or <= whose two sides are the same expression, or a fact that calls its own operation'
    message: '<operation>: ensure <i> cannot fail; both sides are the same: <fact>; for a call of its own operation, <operation>: ensure <i> cannot fail; it calls <operation> itself: <fact>'
    category: 'weak check'
    sub: 'says nothing'
    fix: 'wrong'
    acts: 'agent'
    level: 'warns'
  - rule: 'forbidden_change'
    when: 'an ensure fact that sets a choice property with may_change of an input of the operation to one value, from a start value that may_change gives no arrow to that value and that one start state has while passing every refusal, meeting a who-line and holding every always fact of the things read; checked only when the property is neither computed nor DERIVED, every refusal, who-line and always fact involved can be read and no always fact of another entity reaches the input''s entity, else skipped; the start values of a DEFAULT choice are its default and the values an arrow reaches (the analyser, below)'
    message: '<operation> sets <property> to <value> from <start> or <start>, which may_change does not allow'
    category: 'contradiction'
    sub: 'status rules'
    fix: 'missing'
    acts: 'person'
    level: 'warns'
  - rule: 'question_on_approved'
    when: 'a question on an approved story'
    message: 'story <id> is approved and still has a question'
    category: 'out of date'
    sub: 'open question'
    fix: 'missing'
    acts: 'person'
    level: 'warns'
  - rule: 'wording_drift'
    when: 'section 10'
    message: '<id> <operation>: <side> changed, <other> did not'
    category: 'out of date'
    sub: 'meaning drift'
    fix: 'wrong'
    acts: 'person'
    level: 'warns'
  - rule: 'stale_link'
    when: 'a marker whose version is behind its story''s newest approved version'
    message: '<id>@<n> is behind its approved v<m>'
    category: 'code differs'
    sub: 'stale link'
    fix: 'wrong'
    acts: 'agent'
    level: 'warns'
  - rule: 'unapproved_link'
    when: 'a marker of a story with no approved version yet'
    message: '<id> has no approved version yet'
    category: 'out of date'
    sub: 'not approved'
    fix: 'missing'
    acts: 'person'
    level: 'warns'
  - rule: 'maybe_replaced'
    when: 'a marker on a def that a later binding of its name may replace on some imports: one nested in a branch of any compound statement not proven to run (with, if, try, for, while, match), or in an operand that may not be evaluated (section 9)'
    message: '<function> at line <n> may be replaced by a def, a class or a binding at line <m>, which not every import runs: <text>'
    category: 'code differs'
    sub: 'marker'
    fix: 'wrong'
    acts: 'agent'
    level: 'warns'
  - rule: 'no_story'
    when: 'a top-level function or class of a covered file that no linked function reaches (section 9)'
    message: 'no linked function reaches <name>'
    category: 'code differs'
    sub: 'unlinked code'
    fix: 'missing'
    acts: 'agent'
    level: 'warns'
  - rule: 'pinned_older'
    when: 'an edda.yaml pinning a revision older than the tools (section 9); the tool runs'
    message: 'edda.yaml pins revision <n>; these tools are revision <m>'
    category: 'out of date'
    sub: 'pin behind'
    fix: 'wrong'
    acts: 'person'
    level: 'warns'
  - rule: 'clock_unused'
    when: 'a starts_at: on an example that uses no time (section 8)'
    message: 'example "<title>" uses no time; its starts_at: is never read'
    category: 'misplaced'
    sub: 'unused start'
    fix: 'extra'
    acts: 'agent'
    level: 'warns'

failures:
  - rule: 'failing_example'
    when: 'an example of a story whose operations are bound fails: a wrong verdict, a then fact that does not hold, a given that cannot be made, an at: that would move the clock back, or a call or a read inside a fact that breaks a rule of its operation; one per failure line, at that line'
    message: 'the runner''s line under example "<title>" failed: <file>:<line>: then <text>: found <found>, or <file>:<line>: <found>'
    category: 'code differs'
    sub: 'behaviour'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'failing_case'
    when: 'a generated case breaks a rule (section 9); one per broken rule the failure names, at the rule''s line, or one at no line when it names none'
    message: '<id>: generated cases: failed (seed <n>), then <file>:<line>: <what> for each broken rule'
    category: 'code differs'
    sub: 'behaviour'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'
  - rule: 'failing_function'
    when: 'a row of a client function that its bound real function does not give back (section 9): another result, or an error; one per failing row, at the row''s line'
    message: 'function <name>: failing: <k> of <n> rows failed, then <file>:<line>: <name>(<inputs>) gives <result>, but the code gave <found> or <name>(<inputs>) raised <error>'
    category: 'code differs'
    sub: 'behaviour'
    fix: 'wrong'
    acts: 'agent'
    level: 'blocks'

dimensions:
  - dimension: 'category'
    values: ['unreadable', 'unknown word', 'wrong kind', 'misplaced', 'contradiction', 'weak check', 'out of date', 'code differs']
  - dimension: 'fix'
    values: ['missing', 'wrong', 'extra']
  - dimension: 'acts'
    values: ['agent', 'person', 'language']
  - dimension: 'level'
    values: ['blocks', 'warns', 'note']
  - dimension: 'where'
    values: ['role', 'entity property', 'status rules', 'always', 'permissions', 'function', 'story', 'story rules', 'operation who', 'refuse', 'ensure', 'returns', 'example given', 'example step', 'history', 'code', 'unknown']
  - dimension: 'found_by'
    values: ['reading', 'history', 'analyser', 'example run', 'generated case', 'person review']

sentences:
  - kind: 'story'
    template: '<Story>. As a <role>, I want <i_want>, so that <so_that>.'
  - kind: 'note, question'
    template: 'the text; a story''s notes after the story sentence, then its questions; an operation''s or example''s after its own sentences'
  - kind: 'operation'
    template: '<Name> <is-sentence>.'
  - kind: 'permission'
    template: 'A <role> [whose <actor condition>] may <name> <inputs> [while <state condition>][, if <other actor condition>].; the condition is split only at its top-level and: a part that compares a property of ACTOR (its left side starts with ACTOR.) goes after "whose", any other part that mentions ACTOR (any, all, not, a call, an or, ...) after ", if", the rest after "while"; a condition whose top is not and is one part; an input reads as its type with "a" or "an" when its name is its type (order: order reads "an order"), else <name>, a <type>'
  - kind: 'refusal'
    template: 'If <name> is asked for <an input> whose <condition>, then the system shall refuse it: <reason>. when every left side starts with that input''s name, which is then dropped; otherwise If <name> is asked and <condition>, then ...'
  - kind: 'outcome'
    template: 'When <name> succeeds, <means>. or, without means, When <name> succeeds, <fact in words>.'
  - kind: 'read'
    template: '<Name> gives <returns in words>[, ordered by <keys>].'
  - kind: 'invariant'
    template: 'Always, <fact>.'
  - kind: 'function'
    template: '<Name> is <is>., a client function''s meaning'
  - kind: 'signature'
    template: '<Name> takes <inputs> and gives <type>., its inputs read as a permission''s are, nothing when it has none'
  - kind: 'row'
    template: 'For example, the <name> of <values> gives <value>., one per row, the values read as a given''s are, joined with "and"'
  - kind: 'rule'
    template: 'Rule: <sentence>. as a heading line before its examples; with rules:, the rules come where the examples stood, in rules order, each followed by its examples in shown_by order; without rules:, no rule sentence and the examples in file order'
  - kind: 'example'
    template: 'Example: <title>.'
  - kind: 'given'
    template: 'one sentence for all givens: Given <item>, and <item>.; an actor reads <name>, a <role>; an entity <name>, a <entity> with <property> <value> and <property> <value>; items are joined with ,  and the last with , and  (the comma stays because each item carries its own apposition)'
  - kind: 'when'
    template: 'When <actor> asks to <name> <arguments>[, at <time> (<since>)].; the time only in an example that uses time (section 8): the clock''s time at the call and its distance from the start, the start or start + 1 day 2 hours, the difference of the two wall clocks; a time known only when it runs, , at <at:> (known when it runs), or , at a time (known when it runs) on a step with no at:'
  - kind: 'then'
    template: 'with facts: Then it is done and <facts>. or Then it is refused: <reason>, and <facts>.; without: Then it is done. or Then it is refused: <reason>.; a step without when: Then <facts>.; facts joined with "and"'
